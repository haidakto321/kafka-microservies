server:
  port: 8084

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:                         # only used to publish to the dead-letter topic
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: notification-service  # its own group: it gets EVERY order event (fan-out)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true       # producer span + trace id written into the Kafka headers
    listener:
      observation-enabled: true       # consumer span continues the trace from the headers
      ack-mode: record

logging:
  level:
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # buckets for the p95 latency panel
  tracing:
    sampling:
      probability: 1.0                # demo: keep every trace (production: a few percent)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces    # Jaeger's OTLP/HTTP port
