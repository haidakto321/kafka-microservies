server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: demo
    password: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true                   # errors as RFC 9457 JSON: {"status":404,"detail":"..."}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000            # Kafka down: send() gives up after 5 s (default 60 s); the relay tries again later
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true       # producer span + trace id written into the Kafka headers
    listener:
      observation-enabled: true       # consumer span continues the trace from the headers
      ack-mode: record

inventory:
  base-url: http://localhost:8082
  timeout: 2s

resilience4j:
  retry:
    instances:
      inventory:
        max-attempts: 3                 # 1 call + 2 retries
        wait-duration: 200ms
        retry-exceptions:               # only outages; a 404 is an answer
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10         # look at the last 10 calls
        minimum-number-of-calls: 10     # default 100 - it would never open in a demo
        failure-rate-threshold: 50      # open when half of them failed
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # buckets for the p95 latency panel
  tracing:
    sampling:
      probability: 1.0                # demo: keep every trace (production: a few percent)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces    # Jaeger's OTLP/HTTP port
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    org.apache.kafka: WARN
