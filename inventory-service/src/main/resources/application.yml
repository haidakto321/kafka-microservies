server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory_db
    username: demo
    password: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true                   # errors as RFC 9457 JSON: {"status":404,"detail":"..."}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                       # the broker confirms only when the write is safe
      properties:
        enable.idempotence: true      # retries by the producer never create duplicates in Kafka
        max.block.ms: 5000            # Kafka down: send() gives up after 5 s (default 60 s); the relay tries again later
    consumer:
      group-id: inventory-service     # all instances of this service share the work
      auto-offset-reset: earliest     # a new group starts from the oldest message
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true       # producer span + trace id written into the Kafka headers
    listener:
      observation-enabled: true       # consumer span continues the trace from the headers
      ack-mode: record                # commit the offset after each message is processed

logging:
  level:
    org.apache.kafka: WARN

demo:
  processing-delay-ms: 0              # experiments E1/E6: pause after each command, before the offset commit

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # buckets for the p95 latency panel
  observations:
    enable:
      tasks.scheduled.execution: false   # no trace for every outbox relay poll (every 500 ms) - it buried the real traces
  tracing:
    sampling:
      probability: 1.0                # demo: keep every trace (production: a few percent)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces    # Jaeger's OTLP/HTTP port
