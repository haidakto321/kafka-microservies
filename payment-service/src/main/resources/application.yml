server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/payment_db
    username: demo
    password: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000            # Kafka down: wait at most 5 s for topic metadata (see LEARNINGS section 8)
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true       # producer span + trace id written into the Kafka headers
    listener:
      observation-enabled: true       # consumer span continues the trace from the headers
      ack-mode: record

logging:
  level:
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true    # buckets for the p95 latency panel
  tracing:
    sampling:
      probability: 1.0                # demo: keep every trace (production: a few percent)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces    # Jaeger's OTLP/HTTP port
